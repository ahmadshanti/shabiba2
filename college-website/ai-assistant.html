<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
            <script defer src="/_vercel/insights/script.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الشبيبة الذكي | Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ffcc00;
            --bg-dark: #0a0a0a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --transition: all 0.3s ease;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            font-family: 'Cairo', sans-serif;
            overflow: hidden; /* لمنع ظهور شريط التمرير المزدوج */
            color: #fff;
        }

        /* شريط علوي بتأثير زجاجي */
        .topbar {
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(10px); /* تأثير الضبابية خلف الشريط */
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 204, 0, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* نقطة "مباشر" تنبض */
        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #ff4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        .back-btn {
            background: var(--primary-color);
            border: none;
            padding: 8px 20px;
            border-radius: 50px; /* زر دائري الحواف */
            cursor: pointer;
            font-weight: bold;
            font-family: 'Cairo';
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.2);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: #e6b800;
            box-shadow: 0 6px 15px rgba(255, 204, 0, 0.4);
        }

        /* حاوية الـ Iframe */
        .iframe-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 65px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* شاشة التحميل */
        .loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--glass-bg);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 15px;
            color: var(--primary-color);
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="logo-section">
            <span class="live-dot"></span>
            🤖 مساعد الشبيبة الذكي
        </div>
        <button class="back-btn" onclick="goBack()">🔙 رجوع</button>
    </div>

    <div class="iframe-container">
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <p class="loader-text">جاري تشغيل المساعد الذكي...</p>
        </div>

        <iframe 
            id="myIframe"
            src="https://elicit.org" 
            onload="hideLoader()">
        </iframe>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }

        function hideLoader() {
            const loader = document.getElementById('loader');
            // إخفاء شاشة التحميل بسلاسة
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }
    </script>

</body>
</html>
