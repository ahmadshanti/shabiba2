<!DOCTYPE html>
<html lang="ar" dir="rtl">
    
<head>
    <meta charset="UTF-8">
    <script defer src="/_vercel/insights/script.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="المنصة الأكاديمية لطلاب كلية الأعمال والاتصال. ملخصات، خطط دراسية، ودعم طلابي.">
    <title>منصة كلية الاعمال و الاتصال | الاستقبال</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        // 1. الأمان: منع تحميل الصفحة داخل iframe
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }

        // 2. التحقق من تسجيل الدخول
        const isLoggedIn = localStorage.getItem("logged") === "yes";
        if (isLoggedIn) {
            window.location.replace("dashboard.html"); 
        }
    </script>

    <style>
        /* =========================================
           1. المتغيرات والألوان (مطابقة للداشبورد)
           ========================================= */
        :root {
            --primary: #facc15;          /* أصفر ذهبي */
            --primary-hover: #eab308;    /* أصفر داكن */
            --accent: #fbbf24;           /* أصفر عنبري */
            --card-bg: #171717;          /* رمادي داكن للبطاقة */
            --dark-bg: #0a0a0a;          /* أسود عميق للخلفية */
            --text-light: #ffffff;            
            --gray-text: #a3a3a3;        /* رمادي للنصوص الثانوية */
            --glass-bg: rgba(23, 23, 23, 0.8);
            --glass-border: rgba(250, 204, 21, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at top right, #171717 0%, #0a0a0a 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* تحسين مظهر البطاقة الزجاجية بنمط الداشبورد */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 3rem 2rem;
            border-radius: 30px;
            text-align: center;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: fadeSlideUp 0.8s ease-out forwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .college-logo {
            width: 100%;
            max-width: 450px;
            height: auto;
            margin: 0 auto 30px;
            display: block;
            filter: drop-shadow(0 4px 15px rgba(250, 204, 21, 0.3));
            transition: transform 0.3s ease;
        }

        .college-logo:hover { transform: scale(1.05); }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--primary);
            min-height: 2.5rem;
        }

        .welcome-desc {
            font-size: 1.1rem;
            color: var(--gray-text);
            line-height: 1.7;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* شبكة المميزات */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 35px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px 10px;
            border-radius: 20px;
            border: 1px solid rgba(250, 204, 21, 0.05);
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-8px);
            background: rgba(250, 204, 21, 0.1);
            border-color: var(--primary);
        }

        .feature-icon { font-size: 1.8rem; margin-bottom: 10px; display: block; }
        .feature-text { font-size: 0.95rem; font-weight: 700; color: #fff; }

        /* الزر الذهبي */
        .btn-primary {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: #000;
            border: none;
            padding: 16px 50px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(250, 204, 21, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(250, 204, 21, 0.5);
        }

        .timer-text {
            font-size: 0.95rem;
            margin-top: 20px;
            color: var(--gray-text);
            font-weight: 600;
        }

        .timer-number { color: var(--primary); font-weight: 800; font-size: 1.1rem; }

        .loader {
            display: none;
            width: 22px; height: 22px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center;
            padding: 25px;
            font-size: 0.9rem;
            color: var(--gray-text);
            font-weight: 600;
            border-top: 1px solid var(--glass-border);
        }

        @media (max-width: 480px) {
            .welcome-title { font-size: 1.4rem; }
            .glass-card { padding: 2rem 1.5rem; }
            .college-logo { max-width: 200px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <img src="college-logo.png" alt="شعار كلية الأعمال والاتصال" class="college-logo" onerror="this.style.display='none'">
        
        <h1 class="welcome-title" id="dynamic-quote">جاري التحميل...</h1>
        <p class="welcome-desc">أهلاً بك في المنصة الرقمية الموحدة لطلبة كلية الأعمال والاتصال - حركة الشبيبة الطلابية.</p>
        
        <div class="features-grid">
            <div class="feature-item">
                <span class="feature-icon">📚</span>
                <span class="feature-text">المواد الدراسية</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">✨</span>
                <span class="feature-text">ملخصات شاملة</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">📢</span>
                <span class="feature-text">إعلانات هامة</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🤝</span>
                <span class="feature-text">دعم طلابي</span>
            </div>
        </div>
        
        <div>
            <button class="btn-primary" onclick="startTransition()" id="actionBtn">
                <span id="btnText">الدخول للمنصة 🚀</span>
                <div class="loader" id="btnLoader"></div>
            </button>
            <p class="timer-text" id="timerContainer">سيتم تحويلك تلقائياً خلال <span class="timer-number" id="countdown">15</span> ثانية...</p>
        </div>
    </div>
</div>

<footer>
    جميع الحقوق محفوظة © حركة الشبيبة الطلابية - كلية الأعمال والاتصال 2026
</footer>

<script>
    // العبارات الترحيبية
    const quotes = [
        "شبيبتكم في الميدان تسعى لدعمكم",
        "التعليم الرقمي.. بوابة التميز في عالم الأعمال",
        "شبيبة كلية الأعمال والاتصال معكم باستمرار",
        "نحو مستقبل أكاديمي متميز ومبدع"
    ];
    
    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById("dynamic-quote").innerText = randomQuote;

    let timeLeft = 15;
    let timerInterval;

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("countdown").innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                startTransition();
            }
        }, 1000);
    }

    function startTransition() {
        clearInterval(timerInterval);
        
        const btn = document.getElementById("actionBtn");
        const btnText = document.getElementById("btnText");
        const btnLoader = document.getElementById("btnLoader");

        if (btnText && btnLoader) {
            btnText.innerText = "جاري التحويل...";
            btnLoader.style.display = "block";
        }
        
        btn.style.opacity = "0.8";
        btn.disabled = true;
        document.getElementById("timerContainer").style.visibility = "hidden";

        setTimeout(() => {
            window.location.replace("login.html");
        }, 800);
    }

    startTimer();
</script>

</body>
</html>
